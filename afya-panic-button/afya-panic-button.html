<!--
  AFYA Panic Button – reports "panic" (or any value) when called Y times within X seconds.
  (C) 2019–2026 Marcin Chuć · MIT
-->
<style>
  /* AFYA – common editor style (identical in all AFYA nodes) */
  .afya-form .form-row > label { width: 130px; }
  .afya-form .afya-section {
    display: flex; align-items: center; gap: 7px;
    margin: 18px 0 10px; padding-bottom: 5px;
    border-bottom: 1px solid var(--red-ui-secondary-border-color, #ddd);
    color: var(--red-ui-primary-text-color, #555);
    font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  }
  .afya-form .afya-section > i { color: #3E9C86; width: 14px; text-align: center; }
  .afya-form .afya-hint { margin: -4px 0 12px 134px; font-size: 12px; line-height: 1.45; color: var(--red-ui-secondary-text-color, #888); }
  .afya-form .afya-hint code { font-size: 11px; }
  .afya-form .afya-check { display: flex; align-items: center; gap: 8px; margin: 0 0 12px 134px; }
  .afya-form .afya-check input { width: auto; margin: 0; }
  .afya-form .afya-check label { width: auto; margin: 0; cursor: pointer; }
  .afya-form .afya-unit { margin-left: 8px; color: var(--red-ui-secondary-text-color, #888); }
  .afya-form .afya-summary {
    display: flex; gap: 10px; align-items: flex-start;
    margin-top: 18px; padding: 10px 12px; border-radius: 6px;
    border-left: 4px solid #6CC1AD;
    background: var(--red-ui-tertiary-background, #f7f7f7);
    color: var(--red-ui-primary-text-color, #555); font-size: 12px; line-height: 1.55;
  }
  .afya-form .afya-summary > i { margin-top: 3px; color: #3E9C86; }
  .afya-form .afya-summary code { font-size: 11px; }
</style>

<script type="text/javascript">
  (function () {
    const randomName = (prefix) => prefix + Math.random().toString(36).slice(2, 7) + Date.now().toString().slice(-5);
    const plainKey = (v) => String(v || '').replace(/^#:\(\S+?\)::/, '');
    const positiveNumber = (v) => /^\s*\d+([.,]\d+)?\s*$/.test(String(v)) && Number(String(v).replace(',', '.')) > 0;
    const positiveInt = (v) => /^\d+$/.test(String(v).trim()) && Number(v) > 0;
    const esc = (v) => $('<span>').text(v).html();
    const TEXTS = {
      en: {
        name: 'Name', namePh: 'optional', lang: 'Labels', langAuto: 'system language ({l})',
        secTrigger: 'Trigger', clicks: 'Clicks', times: 'times', within: 'Within', seconds: 'seconds',
        secAnswers: 'Answers', panic: 'Panic', noPanic: 'No panic',
        secVar: 'Context variable', variable: 'Variable',
        varHint: 'Holds <code>{ count, timestamp }</code>. Use a unique name per node, unless several nodes should share one counter.',
        sRule: '<b>{n} messages within {s} s</b> → {panic}, otherwise {calm} with the current count.',
        sCounted: 'Clicks are counted in {v} – nodes with the same variable share one counter.',
      },
      pl: {
        name: 'Nazwa', namePh: 'opcjonalnie', lang: 'Etykiety', langAuto: 'język systemu ({l})',
        secTrigger: 'Wyzwalanie', clicks: 'Kliknięcia', times: 'razy', within: 'W ciągu', seconds: 'sekund',
        secAnswers: 'Odpowiedzi', panic: 'Panika', noPanic: 'Bez paniki',
        secVar: 'Zmienna kontekstu', variable: 'Zmienna',
        varHint: 'Przechowuje <code>{ count, timestamp }</code>. Każdy węzeł – osobna nazwa, chyba że kilka węzłów ma liczyć wspólnie.',
        sRule: '<b>{n} wiadomości w ciągu {s} s</b> → {panic}, w przeciwnym razie {calm} z bieżącą liczbą.',
        sCounted: 'Kliknięcia są liczone w {v} – węzły z tą samą zmienną mają wspólny licznik.',
      },
    };
    // --- AFYA: język opisów w oknie konfiguracji („Labels”): auto = polski tylko dla polskiego systemu,
    //     angielski dla wszystkich innych; zmieniają się tylko opisy – nigdy pola ani wartości.
    const afyaSystemLocale = function () {
      try {
        return localStorage.getItem('editor-language') || navigator.language || '';
      } catch (e) {
        return navigator.language || '';
      }
    };
    const afyaLang = function (setting) {
      if (setting === 'pl' || setting === 'en') return setting;
      return /^pl\b|^pl[-_]/i.test(afyaSystemLocale()) ? 'pl' : 'en';
    };
    /** Tłumaczy otwarte okno (data-t, data-t-ph, data-t-title) i zwraca T(klucz, zmienne) dla tekstów z kodu. */
    const afyaApplyLang = function (form, texts, setting) {
      const lang = afyaLang(setting);
      const T = function (k, v) {
        let s = (texts[lang] && texts[lang][k]) || texts.en[k] || k;
        Object.keys(v || {}).forEach(function (n) {
          s = s.split('{' + n + '}').join(v[n]);
        });
        return s;
      };
      form.find('[data-t]').each(function () {
        $(this).html(T($(this).attr('data-t')));
      });
      form.find('[data-t-ph]').each(function () {
        $(this).attr('placeholder', T($(this).attr('data-t-ph')));
      });
      form.find('[data-t-title]').each(function () {
        $(this).attr('title', T($(this).attr('data-t-title')));
      });
      form.find('#node-input-lang option[value="auto"]').text(T('langAuto', { l: afyaLang('auto') === 'pl' ? 'Polski' : 'English' }));
      return T;
    };

    RED.nodes.registerType('afya-panic-button', {
      category: 'AFYA',
      color: '#A6DCCF',
      paletteLabel: 'panic button',
      icon: 'font-awesome/fa-bell',
      inputs: 1,
      outputs: 1,
      inputLabels: 'click (any message)',
      outputLabels: 'msg.payload = { state, count, timestamp }',
      defaults: {
        name: { value: '' },
        lang: { value: 'auto' },
        variableName: { value: '', required: true },
        scope: { value: 'global' },
        timeToClick: { value: 10, required: true, validate: positiveNumber },
        howManyTimesToClick: { value: 5, required: true, validate: positiveInt },
        answerPanic: { value: 'panic', required: true },
        answerDontPanic: { value: 'dont_panic', required: true },
      },
      label: function () {
        return this.name || this.answerPanic + ' after ' + this.howManyTimesToClick + '× in ' + this.timeToClick + ' s';
      },
      labelStyle: function () {
        return this.name ? 'node_label_italic' : '';
      },
      oneditprepare: function () {
        if (['auto', 'en', 'pl'].indexOf(this.lang) < 0) $('#node-input-lang').val('auto'); // starsze węzły
        const form = $('#node-input-lang').closest('.afya-form');
        let T = afyaApplyLang(form, TEXTS, $('#node-input-lang').val());
        // nodes saved before 0.1.0 have no scope → they used flow context
        if (!this.scope) $('#node-input-scope').val('flow');
        const name = $('#node-input-variableName');
        if (!plainKey(name.val())) name.val(randomName('AFYA_'));
        name.typedInput({ types: ['global', 'flow'], typeField: '#node-input-scope' });

        $('#node-input-howManyTimesToClick').spinner({ min: 1 });
        $('#node-input-timeToClick').spinner({ min: 1 });

        const summary = function () {
          const times = $('#node-input-howManyTimesToClick').val();
          const secs = $('#node-input-timeToClick').val();
          const panic = $('#node-input-answerPanic').val();
          const calm = $('#node-input-answerDontPanic').val();
          $('#afya-panic-summary').html(
            T('sRule', { n: esc(times), s: esc(secs), panic: '<code>state: "' + esc(panic) + '"</code>', calm: '<code>state: "' + esc(calm) + '"</code>' }) + '<br>' +
            T('sCounted', { v: '<code>' + name.typedInput('type') + '.' + esc(plainKey(name.typedInput('value')) || '…') + '</code>' })
          );
        };
        name.on('change', summary);
        $('#node-input-howManyTimesToClick, #node-input-timeToClick, #node-input-answerPanic, #node-input-answerDontPanic')
          .on('change keyup spin spinstop', function () { setTimeout(summary, 0); });
        $('#node-input-lang').on('change', function () {
          T = afyaApplyLang(form, TEXTS, $(this).val());
          summary();
        });
        summary();
      },
    });
  })();
</script>

<script type="text/html" data-template-name="afya-panic-button">
  <div class="afya-form">
    <div class="form-row">
      <label for="node-input-name"><i class="fa fa-tag"></i> <span data-t="name">Name</span></label>
      <input type="text" id="node-input-name" data-t-ph="namePh" placeholder="optional" style="width: 65%;">
    </div>
    <div class="form-row">
      <label for="node-input-lang"><i class="fa fa-language"></i> <span data-t="lang">Labels</span></label>
      <select id="node-input-lang" style="width: 65%;">
        <option value="auto">system language</option>
        <option value="en">English</option>
        <option value="pl">Polski</option>
      </select>
    </div>

    <div class="afya-section"><i class="fa fa-hand-pointer-o"></i> <span data-t="secTrigger">Trigger</span></div>
    <div class="form-row">
      <label for="node-input-howManyTimesToClick"><i class="fa fa-repeat"></i> <span data-t="clicks">Clicks</span></label>
      <input type="text" id="node-input-howManyTimesToClick" style="width: 80px;">
      <span class="afya-unit" data-t="times">times</span>
    </div>
    <div class="form-row">
      <label for="node-input-timeToClick"><i class="fa fa-clock-o"></i> <span data-t="within">Within</span></label>
      <input type="text" id="node-input-timeToClick" style="width: 80px;">
      <span class="afya-unit" data-t="seconds">seconds</span>
    </div>

    <div class="afya-section"><i class="fa fa-reply"></i> <span data-t="secAnswers">Answers</span></div>
    <div class="form-row">
      <label for="node-input-answerPanic"><i class="fa fa-exclamation-triangle"></i> <span data-t="panic">Panic</span></label>
      <input type="text" id="node-input-answerPanic" style="width: 65%;">
    </div>
    <div class="form-row">
      <label for="node-input-answerDontPanic"><i class="fa fa-check"></i> <span data-t="noPanic">No panic</span></label>
      <input type="text" id="node-input-answerDontPanic" style="width: 65%;">
    </div>

    <div class="afya-section"><i class="fa fa-database"></i> <span data-t="secVar">Context variable</span></div>
    <div class="form-row">
      <label for="node-input-variableName"><i class="fa fa-globe"></i> <span data-t="variable">Variable</span></label>
      <input type="text" id="node-input-variableName" style="width: 65%;">
      <input type="hidden" id="node-input-scope">
    </div>
    <div class="afya-hint" data-t="varHint">Holds <code>{ count, timestamp }</code>. Use a unique name per node, unless several nodes should share one counter.</div>

    <div class="afya-summary"><i class="fa fa-info-circle"></i><span id="afya-panic-summary"></span></div>
  </div>
</script>

<script type="text/html" data-help-name="afya-panic-button">
  <p>Reports <i>panic</i> (or any value you set) when it receives <b>Y</b> messages within <b>X</b> seconds.
    E.g. press one remote button (Hue / Tradfri) 5× within 10 s to arm the alarm or switch everything off.</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">any</span></dt>
    <dd>Every message counts as one click.</dd>
  </dl>

  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload.state <span class="property-type">string</span></dt>
    <dd>The <i>Panic</i> answer when the number of clicks is reached, otherwise the <i>No panic</i> answer.</dd>
    <dt>payload.count <span class="property-type">number</span></dt>
    <dd>Clicks in the current series.</dd>
    <dt>payload.timestamp <span class="property-type">number</span></dt>
    <dd>Start of the current series (ms); for panic – the time of panic.</dd>
  </dl>

  <h3>Details</h3>
  <p>The counter is stored in a <b>global</b> or <b>flow</b> context variable (<code>{ count, timestamp }</code>),
    so it can be read from other flows. Every new node gets a random, unique name. Nodes created before
    version 0.1.0 keep using <b>flow</b> until you change it. Other properties of the incoming message are passed through
    – route the panic with a <i>switch</i> node on <code>msg.payload.state</code>.</p>

  <h3>Polski</h3>
  <p>Zgłasza <i>panic</i> (lub dowolną ustaloną wartość), gdy w ciągu X sekund przyjdzie Y wiadomości – np. 5×
    ten sam przycisk pilota w 10 s uzbraja alarm. Licznik jest w zmiennej <b>global</b> lub <b>flow</b>;
    każdy nowy węzeł dostaje unikalną nazwę.</p>

  <p><small>Marcin Chuć · MIT</small></p>
</script>
